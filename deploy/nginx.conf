# Replace roomly.example.com and certificate paths with your domain.
server {
    listen 80;
    server_name roomly.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name roomly.example.com;
    ssl_certificate /etc/letsencrypt/live/roomly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomly.example.com/privkey.pem;
    root /srv/roomly/current/dist;
    index index.html;
    client_max_body_size 40m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self)" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 360s;
        proxy_buffering off;
    }
    # Use an SSH tunnel to 8090 for the superuser dashboard.
    location /_/ { return 404; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(glb|usdz)$ {
        types { model/gltf-binary glb; model/vnd.usdz+zip usdz; }
        expires 1h;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
